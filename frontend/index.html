
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard · FleetPilot</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="brand">Fleet<span>Pilot</span></div>

            <nav class="nav">
                <a href="/" class="active">Dashboard</a>
                <a href="/vehicles.html">Vehicles</a>
                <span class="soon">Trips <small>soon</small></span>
                <span class="soon">Expenses <small>soon</small></span>
                <span class="soon">Maintenance <small>soon</small></span>
            </nav>
        </aside>

        <main class="content">
            <div class="page-header">
                <h1>Dashboard</h1>
            </div>

            <div class="card">
                <p>
                    The dashboard arrives in Step 7. For now:
                    <a href="/vehicles.html">manage vehicles</a>.
                </p>

                <p>
                    Server: <strong id="status">checking…</strong>
                </p>
            </div>
        </main>
    </div>

    <script type="module">
        import { api } from '/js/api.js';

        const statusEl = document.getElementById('status');

        try {
            await api('/health');
            statusEl.textContent = 'OK, database connected';
        } catch (err) {
            statusEl.textContent = err.message;
        }
    </script>
</body>
</html>
