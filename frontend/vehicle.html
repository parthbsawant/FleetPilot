<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vehicle · FleetPilot</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="brand">Fleet<span>Pilot</span></div>

            <nav class="nav">
                <a href="/">Dashboard</a>
                <a href="/vehicles.html" class="active">Vehicles</a>
                <a href="/trips.html">Trips</a>
                <span class="soon">Expenses <small>soon</small></span>
                <span class="soon">Maintenance <small>soon</small></span>
            </nav>
        </aside>

        <main class="content">
            <a href="/vehicles.html" class="back-link">‹ All vehicles</a>

            <div class="page-header">
                <h1 id="vehicle-title">Vehicle</h1>
            </div>

            <div id="notice" class="notice hidden"></div>

            <!-- The vehicle's details are put here by vehicle.js -->
            <div class="card details" id="details"></div>

                        <!-- This vehicle's latest trips, put here by vehicle.js -->
            <h2 class="section-title" id="trips-title">Recent trips</h2>

            <div class="card table-wrap" id="trips-card">
                <table>
                    <thead>
                        <tr>
                            <th>Route</th>
                            <th>Start</th>
                            <th class="num">Distance</th>
                            <th>Status</th>
                        </tr>
                    </thead>

                    <tbody id="trip-rows"></tbody>
                </table>
            </div>

        </main>
    </div>

    <script type="module" src="/js/vehicle.js"></script>
</body>
</html>
